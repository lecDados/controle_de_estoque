<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="public\style.css">
    <title>Controle de estoque</title>
    
</head>
<body>


                    <section class="inferior" >




                    <fieldset class="entrada">
                    <div  style="display: flex; flex-direction: column; max-width: 200px; gap: 4px;">
                    <p>Novo item</p>
                    <label  for="text">Nome:</label>
                    <input id="nome" type="text" placeholder="Nome">
                    <label for="text">R$:</label>
                    <input id="valor" type="number" placeholder="Valor">
                    <label for="text">Quantidade:</label>
                    <input id="quantidade" type="number" placeholder="Quantidade">
                    
                    
                    <select name="categoria" id="categoria" >

                        <option value="acessorio">acessorios</option>

                        <option value="objeto">Objetos</option>

                        <option value="roupa">Roupas</option>

                    </select>

                    <button class="bt_enviar" type="button" onclick="enviar()">
                        Enviar
                    </button>
                    </fieldset>

                    </div>




                    <fieldset class="entrada" >
                    <div>
                    <p>Valor em Produto:</p>
                    <div id="mostrar_total"> </div>

                    </div>
                    </fieldset>





                    <fieldset class="entrada">
                    <div>
                        <p>Quantidade:</p>
                    <div id="quantidade_item"></div>
                    </div>
                    </fieldset>
                    </section>

                    <main class="buts">


                    <button class="bt_comum" onclick="Acessorios()">Acessorios</button>
                    <button class="bt_comum" onclick="Objetos()">Objetos</button>
                    <button class="bt_comum" onclick="Roupas()">Roupas</button>
                    <button class="bt_comum_negativo" onclick="Repor()">Reposicao</button>


                    </main>

                    <hr>

                    <div id="resultado"></div>

</body>


<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>

    async function enviar(){

    const nome = document.getElementById("nome").value;
    const valor = parseFloat(document.getElementById("valor").value);
    const quantidade = parseInt(document.getElementById("quantidade").value);
    const categoria = document.getElementById("categoria").value;

    if(!nome){
        await Swal.fire({
            title: "Insira os dados",
            icon: "warning",
            confirmButtonText: "voltar",
            confirmButtonColor: "rgb(194, 36, 89)"
        });

        return;
    }

    const total_item = valor * quantidade;

    await fetch("http://localhost:3000/criar", {

        method: "POST",

        headers:{
            "Content-Type": "application/json"
        },

        body: JSON.stringify({
            nome,
            valor,
            quantidade,
            categoria,
            total_item,
        })
    });

    await buscar();

    Swal.fire({
        title: "Criado com sucesso",
        icon: "success",
        confirmButtonText: "voltar",
        confirmButtonColor: "rgb(194, 36, 89)"
    });
}

    
        async function buscar() {

        const resposta = await fetch("http://localhost:3000/lista");

        
        const dados = await resposta.json();

        const resultado = document.getElementById("resultado");

        resultado.innerHTML="";


                dados.forEach(item => {
                    resultado.innerHTML += `
            <fieldset class="mostrarpadrao">
                <p>Nome: ${item.nome}</p>
                <p>Valor cada: R$ ${item.valor}</p>
                <p>Quant.: ${item.quantidade}</p>
                <p>Valor total.: R$ ${item.total_item.toFixed(2)}</p>
                <button class="bt_delet" type="button" onclick="delet('${item._id}')">
                    delet
                    </button>
            </fieldset>
            ` 
                }); 


total()
quantidade() 


    }

buscar()
    
                                                            async function delet(_id){

    const resposta = await Swal.fire({

        title: "Deseja deletar?",
        text: "Essa ação não poderá ser desfeita.",
        icon: "warning",
        

        showCancelButton: true,

        confirmButtonText: "Sim",
        cancelButtonText: "Cancelar",

        confirmButtonColor: "rgb(194, 36, 89)"
    });

    if(!resposta.isConfirmed){
        return;
    }

    await fetch(`http://localhost:3000/lista/${_id}`, {

        method: "DELETE"
    });

    Swal.fire({
        title: "Deletado!",
        icon: "success",
        confirmButtonColor: "rgb(194, 36, 89)"
    });

    buscar();
}

                async function total() {
                
                const mostrar_total = document.getElementById("mostrar_total");

                const resposta = await fetch("http://localhost:3000/lista")

                const dados = await resposta.json()

                mostrar_total.innerHTML = "Total: R$ 0";

                let valores = 0

                dados.forEach(item=>{

                    valores += item.total_item
                    

                    mostrar_total.innerHTML =  
                    `Total: R$ ${valores.toLocaleString("pt-BR", {
                                style: "currency",
                                currency: "BRL"
                                })}`

                })
    }


total()

                        async function quantidade(){
    

                        const quantidade = document.getElementById("quantidade_item");


                        

                const resposta = await fetch("http://localhost:3000/lista")

                const dados = await resposta.json()

                let total = 0
                

                dados.forEach(item=>{

                    total += item.quantidade;

                });


                quantidade.innerHTML = `Itens: ${total}`
}

quantidade()

async function Repor() {

    const resultado = document.getElementById("resultado");

    const resposta = await fetch("http://localhost:3000/repor");

    const dados = await resposta.json()



    resultado.innerHTML=``;

    dados.forEach(item =>{

        resultado.innerHTML += `

<fieldset class="mostrarpadrao">

    <p>Nome: ${item.nome}</p>

    <p>Quant.: ${item.quantidade}</p>
    <p class="negativo">

    </p>

    

</fieldset>
`

</script>

</html>
