<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de estoque</title>
</head>
<body>

                    <section style="display: flex; justify-content: center; flex-wrap: wrap; gap: 40px; ">




                    <fieldset>
                    <div style="display: flex; flex-direction: column; max-width: 200px; gap: 4px;">
                    <p>Novo item</p>
                    <label for="text">Nome:</label>
                    <input id="nome" type="text" placeholder="Nome">
                    <label for="text">R$:</label>
                    <input id="valor" type="number" placeholder="Valor">
                    <label for="text">Quantidade:</label>
                    <input id="quantidade" type="number" placeholder="Quantidade">
                    
                    
                    <select name="categoria" id="categoria">

                        <option value="acessorio">acessorios</option>

                        <option value="objeto">Objetos</option>

                        <option value="roupa">Roupas</option>

                    </select>

                    <button type="button" onclick="enviar()">
                        Enviar
                    </button>
                    </fieldset>

                    </div>




                    <fieldset>
                    <div>
                    <p>Valor em Produto:</p>
                    <div id="mostrar_total"> </div>

                    </div>
                    </fieldset>





                    <fieldset>
                    <div>
                        <p>Quantidade:</p>
                    <div id="quantidade_item"></div>
                    </div>
                    </fieldset>
                    </section>

                    <main style="display: flex; flex-direction: row; gap: 100px; justify-content: center; padding-top:40px ;">


                    <button onclick="Acessorios()">Acessorios</button>
                    <button onclick="Objetos()">Objetos</button>
                    <button onclick="Roupas()">Roupas</button>


                    </main>

                    <hr>

                    <div id="resultado"></div>

</body>



<script>

    async function enviar(){
            
            const nome = document.getElementById("nome").value;
            const valor = document.getElementById("valor").value;
            const quantidade = document.getElementById("quantidade").value;
            const categoria = document.getElementById("categoria").value;


                    const resposta = await fetch("http://localhost:3000/criar",{
                        

                        method: "POST",


                        headers:{
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            nome,
                            valor,
                            quantidade,
                            categoria,
                        })

                })


    buscar()
    
    }

    
        async function buscar() {

        const resposta = await fetch("http://localhost:3000/lista");

        
        const dados = await resposta.json();

        const resultado = document.getElementById("resultado");

        resultado.innerHTML="";


                dados.forEach(item => {
                    resultado.innerHTML += `
                    <fieldset>
                    <p> nome: ${item.nome}</p>
         
                    <button type="button" onclick="delet('${item._id}')">
                    delet
                    </button>
                    </fieldset>
                    
                    ` 
                }); 


total()
quantidade() 


    }

buscar()
    
                                                            async function delet(_id){

                                                            await fetch(`http://localhost:3000/lista/${_id}`,{


                                                                    method: "DELETE"
                                                            })


buscar()

    

                                                            }

                async function total() {
                
                const mostrar_total = document.getElementById("mostrar_total");

                const resposta = await fetch("http://localhost:3000/lista")

                const dados = await resposta.json()

                mostrar_total.innerHTML = "Total: R$ 0";

                let valores = 0

                dados.forEach(item=>{

                    valores += item.valor

                    mostrar_total.innerHTML = `Total: R$ ${valores}`

                })
    }


total()

                        async function quantidade(){
    

                        const quantidade = document.getElementById("quantidade_item");


                        

                const resposta = await fetch("http://localhost:3000/lista")

                const dados = await resposta.json()

                let total = 0
                

                dados.forEach(item=>{

                    total += item.quantidade;

                });


                quantidade.innerHTML = `Itens: ${total}`
}

quantidade()
      

async  function Acessorios(){

    const resposta = await fetch("http://localhost:3000/acessorios");

    const dados = await resposta.json();

    const resultado = document.getElementById("resultado");

        resultado.innerHTML="";
    
        dados.forEach(item=>{

            resultado.innerHTML += `
            <fieldset>
                <p>Nome: ${item.nome}</p>
                <p>Valor: ${item.valor}</p>
                <p>Quant.: ${item.quantidade}</p>
                <button type="button" onclick="delet('${item._id}')">
                    delet
                    </button>
            </fieldset>
            `
        })

}

    const resposta = await fetch("http://localhost:3000/roupa");

        resultado.innerHTML="";

            resultado.innerHTML += `

                <p>Valor: ${item.valor}</p>
                <p>Quant.: ${item.quantidade}</p>


                <button type="button" onclick="delet('${item._id}')">
                    delet
                    </button>
            </fieldset>
            `
        })

}

    const resposta = await fetch("http://localhost:3000/objeto");

    const resultado = document.getElementById("resultado");

        resultado.innerHTML="";
    
        dados.forEach(item=>{

            resultado.innerHTML += `

            <fieldset>
                <p>Nome: ${item.nome}</p>
                <p>Valor: ${item.valor}</p>
                <p>Quant.: ${item.quantidade}</p>


                <button type="button" onclick="delet('${item._id}')">

            </fieldset>
            `
        })

}


</script>

</html>
