<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de estoque</title>
</head>
<body>

    <section style="display: flex; flex-direction: flex;">
    <div style="display: flex; flex-direction: column; max-width: 200px; gap: 4px;">
        <p>Novo item</p>
        <input id="nome" type="text" placeholder="Nome">
        
        <input id="valor" type="number" placeholder="Valor">
        
        <input id="quantidade" type="number" placeholder="Quantidade">

        <button type="button" onclick="enviar()">
            Enviar
        </button>

    </div>
    <hr>
    <div>
        <p>Valor em Produto:</p>
        <div id="mostrar_total"> </div>

    </div>
    </section>

    <hr>

    <div id="resultado"></div>

</body>

<script>

    async function enviar(){
            
            const nome = document.getElementById("nome").value;
            const valor = document.getElementById("valor").value;
            const quantidade = document.getElementById("quantidade").value;


                    const resposta = await fetch("http://localhost:3000/criar",{
                        

                        method: "POST",


                        headers:{
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            nome,
                            valor,
                            quantidade 
                        })

                })
                total() 
                buscar()
    }

    
    async function buscar() {

        const resposta = await fetch("http://localhost:3000/lista");

        
        const dados = await resposta.json();

        const resultado = document.getElementById("resultado");

        resultado.innerHTML="";


                dados.forEach(item => {
                    resultado.innerHTML += `
                    
                    <p> nome: ${item.nome}</p>
                    
                    <button type="button" onclick="but()">
                    hello
                </button>
                    
                    <hr>
                    ` 
                });  
    }
    buscar()
    
    function but(){
        alert("hello!");
    }

    async function total() {
        
        const mostrar_total = document.getElementById("mostrar_total");

        const resposta = await fetch("http://localhost:3000/lista")

        const dados = await resposta.json()

        mostrar_total.innerHTML = "";
        let valores = 0
        dados.forEach(item=>{
            valores += item.valor
            mostrar_total.innerHTML = `Total: ${valores}`
        })
    }
    total()
    

</script>

</html>
