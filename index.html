<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de estoque</title>
</head>
<body>

    <section style="display: flex; flex-direction: flex;">
    <div style="display: flex; flex-direction: column; max-width: 200px; gap: 4px;">
        <p>Novo item</p>
        <input id="nome" type="text" placeholder="Nome">
        
        <input id="valor" type="number" placeholder="Valor">
        
        <input id="quantidade" type="number" placeholder="Quantidade">

        <button type="button" onclick="enviar()">
            Enviar
        </button>

    </div>
    <hr>
    <div>
        <p>Valor em Produto:</p>
        <div id="mostrar_total"> </div>

    </div>
    </section>

    <hr>

    <div id="resultado"></div>

</body>

<script>

    async function enviar(){

        const nome = document.getElementById("nome").value;

        const valor = document.getElementById("valor").value;

        const quantidade = document.getElementById("quantidade").value;

        console.log("FRONTEND ENVIANDO");

        try {

            const response = await fetch("http://localhost:3000/lista", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    nome,
                    valor,
                    quantidade
                })

            });

            const data = await response.json();

            console.log(data);

            buscarDados();

        } catch(error){

            console.log(error);

        }

    }

    async function buscarDados(){

        try {

            const response = await fetch("http://localhost:3000/lista");
            const dado_total = await fetch("http://localhost:3000/total")
            
            const data = await response.json();
            const total_json = await dado_total.json();

            const resultado = document.getElementById("resultado");
            const mostrar_total = document.getElementById("mostrar_total");

            

            mostrar_total.innerHTML = total_json.mostra_total;

            resultado.innerHTML = "";

            data.forEach((item) => {

                resultado.innerHTML += `
                    Nome: ${item.nome} <br>
                    Valor: ${item.valor} <br>
                    Quantidade: ${ item.valor} <br> <hr>
                `;

            });

        } catch(error){

            console.log(error);

        }

    }

    buscarDados();

</script>

</html>
